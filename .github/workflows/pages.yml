name: Deploy GitHub Pages

# Pages is currently configured as "Deploy from a branch" (main / root), so GitHub's
# own build already publishes every push. Running this workflow on push as well makes
# two deployments contend for the same Pages environment and both time out, so it is
# manual-only. Re-add the push trigger if Settings > Pages > Source is switched to
# "GitHub Actions" (which also lets us publish JeffcoDashboard/ as the site root).
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Static site: publish the JeffcoDashboard app folder (no build step).
      # Note: node_modules / desktop binaries are gitignored and not included.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: JeffcoDashboard

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Default is 10 minutes (600000ms); bump to 30 minutes to avoid intermittent deploy timeouts.
          timeout: "1800000"

