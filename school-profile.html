<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Profile</title>

  <!-- CSV parser (same as dashboard) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" defer></script>

  <style>
    :root {
      --blue: #007cbf;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --bg: #f8fafc;
    }

    body {
      margin: 0;
      font-family: "Franklin Gothic Book", "Franklin Gothic", "Arial Narrow", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .topbar {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }
    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-left .label {
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
    }
    .logos {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .logos img {
      height: 26px;
      max-height: 26px;
      width: auto;
      max-width: 160px;
      object-fit: contain;
      display: block;
    }
    .title {
      text-align: center;
      font-weight: 800;
      color: var(--text);
      line-height: 1.2;
    }
    .title .sub {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 2px;
    }
    .topbar-right {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
    }
    .btn.primary {
      border-color: var(--blue);
      color: var(--blue);
    }

    @media (max-width: 720px) {
      .topbar {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .brand-left, .topbar-right {
        justify-content: center;
      }
      .title {
        text-align: center;
      }
    }

    .page {
      padding: 14px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      padding: 14px;
    }

    .section-title {
      margin: 0 0 10px 0;
      font-size: 16px;
      font-weight: 900;
    }

    .summary-name {
      font-size: 20px;
      font-weight: 900;
      margin: 0;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
      margin-top: 10px;
    }
    .control label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
    }
    .control input, .control select {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
      background: #fff;
      color: var(--text);
    }

    @media (max-width: 900px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }

    .meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th {
      background: #f3f4f6;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
    }
    tbody tr:hover td {
      background: #fafafa;
    }
    .group-row td {
      background: #eef2f7;
      font-weight: 900;
      color: #0f172a;
    }
    .muted {
      color: var(--muted);
    }
    .empty {
      padding: 14px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--muted);
      background: #fff;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand-left">
      <span class="label">Developed for</span>
      <div class="logos" aria-label="Developed for / by logos">
        <img src="client-logo.png" alt="Jeffco Public Schools" />
        <span class="label">by</span>
        <img src="PerkinsEastmanLogo.svg" alt="Perkins Eastman" />
      </div>
    </div>

    <div class="title">
      School Facility Planning Webtool
      <span class="sub">School Profile</span>
    </div>

    <div class="topbar-right">
      <a class="btn" href="index.html" target="_blank" rel="noopener noreferrer">Back to Dashboard</a>
      <button class="btn primary" id="downloadCsvBtn" type="button">Download filtered CSV</button>
    </div>
  </div>

  <div class="page">
    <div class="card">
      <h2 class="section-title">School summary</h2>
      <p class="summary-name" id="schoolNameHeader">—</p>
      <div class="meta" id="schoolMeta"></div>
    </div>

    <div style="height: 12px;"></div>

    <div class="card">
      <h2 class="section-title">Assets / Projects</h2>

      <div class="controls" aria-label="Table controls">
        <div class="control">
          <label for="searchInput">Search</label>
          <input id="searchInput" type="text" placeholder="Filter rows by text…" />
        </div>
        <div class="control">
          <label for="systemCategoryFilter">SystemCategory</label>
          <select id="systemCategoryFilter">
            <option value="">All</option>
          </select>
        </div>
        <div class="control">
          <label for="assetTypeFilter">AssetType</label>
          <select id="assetTypeFilter">
            <option value="">All</option>
          </select>
        </div>
        <div>
          <button class="btn" id="clearFiltersBtn" type="button">Clear filters</button>
        </div>
      </div>

      <div id="tableMount"></div>
    </div>
  </div>

  <script src="school-profile.js?v=20251219_1" defer></script>
</body>
</html>
