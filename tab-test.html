<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Test</title>
    <style>
        .tab-button {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 10px 20px;
            cursor: pointer;
            display: inline-block;
            margin-right: 5px;
        }
        .tab-button.active {
            background: #007bff;
            color: white;
        }
        .tab-content {
            display: none;
            padding: 20px;
            border: 1px solid #ccc;
            margin-top: 10px;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Tab Test</h1>
    
    <div class="tab-buttons">
        <button class="tab-button active" onclick="showTab('tab1')">Tab 1</button>
        <button class="tab-button" onclick="showTab('tab2')">Tab 2</button>
        <button class="tab-button" onclick="showTab('tab3')">Tab 3</button>
    </div>
    
    <div id="tab1" class="tab-content active">
        <h2>Tab 1 Content</h2>
        <p>This is the content for Tab 1. It should be visible by default.</p>
    </div>
    
    <div id="tab2" class="tab-content">
        <h2>Tab 2 Content</h2>
        <p>This is the content for Tab 2. Click the Tab 2 button to see this.</p>
    </div>
    
    <div id="tab3" class="tab-content">
        <h2>Tab 3 Content</h2>
        <p>This is the content for Tab 3. Click the Tab 3 button to see this.</p>
    </div>
    
    <script>
        function showTab(tabName) {
            console.log('Switching to tab:', tabName);
            
            // Hide all tab contents
            const tabContents = document.querySelectorAll('.tab-content');
            tabContents.forEach(content => {
                content.classList.remove('active');
            });
            
            // Remove active class from all tab buttons
            const tabButtons = document.querySelectorAll('.tab-button');
            tabButtons.forEach(button => {
                button.classList.remove('active');
            });
            
            // Show selected tab content
            const targetTab = document.getElementById(tabName);
            if (targetTab) {
                targetTab.classList.add('active');
                console.log('Tab activated:', tabName);
            }
            
            // Add active class to clicked button
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
